databases:
  - type: postgres
    name: grid-chain-db
    plan: free
    databaseName: gridchain
    user: gridchain

services:
  - type: web
    name: grid-chain
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: DATABASE_URL
        fromDatabase:
          name: grid-chain-db
          property: connectionString
